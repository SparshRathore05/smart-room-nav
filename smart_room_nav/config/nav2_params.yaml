amcl:
  ros__parameters:
    use_sim_time: True
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      yaw: 0.0

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "/home/sparsh05/nav_map/my_housemap.yaml"

planner_server:
  ros__parameters:
    use_sim_time: True
    plugin_names: ["GridBased"]
    plugin_types: ["nav2_navfn_planner/NavfnPlanner"]

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      critics:
        - RotateToGoal
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist

      min_vel_x: 0.0
      max_vel_x: 0.2
      max_vel_theta: 1.0

bt_navigator:
  ros__parameters:
    use_sim_time: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    plugin_names: ["spin", "backup", "wait"]
    plugin_types:
      - nav2_behaviors/Spin
      - nav2_behaviors/BackUp
      - nav2_behaviors/Wait

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      robot_radius: 0.22
      inflation_layer:
        inflation_radius: 0.3

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      robot_radius: 0.22
      inflation_layer:
        inflation_radius: 0.3
